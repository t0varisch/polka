<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#1b1e24" />
		<meta name="description" content="Книги тремя способами: страницами, по слову, печатая. FB2, EPUB, TXT, PDF" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Полка" />
		<link rel="icon" href="./icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
		<title>Полка — книги тремя способами</title>
		<script>
			// Тема до загрузки приложения, чтобы не мигало белым
			try {
				var s = JSON.parse(localStorage.getItem("polka:settings") || "{}");
				var t = s.theme || "auto";
				if (t === "auto") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
				document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
	</head>
	<body>
		<div id="app"></div>
		<noscript>
			<p style="padding: 24px; font: 16px/1.5 system-ui, sans-serif">
				Для чтения нужен JavaScript. Открой эту ссылку в Safari или Chrome.
			</p>
		</noscript>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
